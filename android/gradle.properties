# Keep release builds reliable on developer/CI machines with limited free RAM.
# R8/D8 still receive enough heap, while bounded workers avoid several JVMs
# competing for memory and stalling indefinitely.
org.gradle.jvmargs=-Xmx3G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=true
kotlin.daemon.jvm.options=-Xmx768m
org.gradle.java.home=C:/Program Files/Microsoft/jdk-17.0.19.10-hotspot
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
